[package]
name = "robiade-adapters"
edition.workspace = true
version.workspace = true

[dependencies]
robiade-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
portable-pty = "0.9"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3.5.0", features = ["json"] }
secrecy = "0.10.3"
# Docker par son socket Unix, sans client HTTP/TCP ni TLS.
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread"] }
# Client Postgres synchrone, TLS du système (Security.framework), sans OpenSSL.
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
