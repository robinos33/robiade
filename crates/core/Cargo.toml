[package]
name = "robiade-core"
edition.workspace = true
version.workspace = true

# Règle hexagonale vérifiée par le compilateur : aucune dépendance d'I/O ici.
[dependencies]
thiserror.workspace = true
# Analyse des commandes Mongo, sans I/O : le document analysé est celui que l'adapter envoie.
serde_json = { workspace = true, features = ["preserve_order"] }
