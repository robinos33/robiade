[workspace]
resolver = "2"
members = ["crates/core", "crates/adapters", "app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
robiade-core = { path = "crates/core" }
robiade-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
